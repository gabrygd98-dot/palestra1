<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scheda palestra</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0E1620">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Palestra">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#E8EBEF;--card:#F7F8FA;--ink:#18212C;--mute:#5E6B7A;--line:#CBD2DA;--acc:#2450F0;--onacc:#fff;--ok:#18212C;--onok:#F7F8FA;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#0E1620;--card:#172230;--ink:#E9EEF4;--mute:#8E9CAD;--line:#2A3949;--acc:#7C97FF;--onacc:#0E1620;--ok:#E9EEF4;--onok:#0E1620}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:110px}
.f{font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;font-weight:700}
header{padding:16px 16px 4px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}#th{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:transparent;color:var(--ink);font-size:20px;cursor:pointer;flex:none}
h1{margin:0;font-size:30px;line-height:1}
.sub{color:var(--mute);font-size:14px;margin-top:4px}
nav{display:flex;gap:8px;padding:12px 16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{flex:1;padding:10px 4px;border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;font-size:20px;cursor:pointer}
nav button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{padding:0 16px;display:grid;gap:12px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.card.fin{border-color:var(--acc)}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.name{font-size:22px;line-height:1.1}
.note{color:var(--mute);font-size:13px;margin-top:2px}
.scheme{font-size:26px;white-space:nowrap}
.row{display:flex;gap:12px;margin-top:12px;align-items:end;flex-wrap:wrap}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:4px}
.kg{width:92px;font:700 24px "Barlow Condensed","Arial Narrow",sans-serif;padding:6px 8px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.step{display:flex;align-items:center;border:2px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.step button{width:40px;height:42px;border:0;background:transparent;color:var(--ink);font-size:22px;cursor:pointer}
.step span{min-width:56px;text-align:center;font:700 22px "Barlow Condensed","Arial Narrow",sans-serif}
.sets{display:flex;flex-direction:column;margin-top:12px}.sr{display:flex;align-items:center;gap:6px;padding:8px 0;border-top:1px solid var(--line)}.sn{width:22px;font-size:20px;color:var(--mute)}.u{font-size:12px;color:var(--mute);margin-right:6px}.sr .set{width:46px;height:46px;margin-left:auto;font-size:22px}.sc{display:flex;flex-direction:column;align-items:center;gap:6px}.sk{width:58px;font:700 18px "Barlow Condensed","Arial Narrow",sans-serif;text-align:center;padding:4px 2px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}.rt{display:flex;gap:10px;align-items:center}.mv{display:flex;flex-direction:column;gap:4px}.mv button{width:36px;height:30px;border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;cursor:pointer;font-size:14px}.mv button:disabled{opacity:.3;cursor:default}
.set{width:52px;height:52px;border-radius:50%;border:2px solid var(--ink);background:transparent;color:var(--ink);font:700 22px "Barlow Condensed","Arial Narrow",sans-serif;cursor:pointer}
.set.on{background:var(--ok);color:var(--onok)}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.tools{display:flex;justify-content:center;gap:10px;padding:8px 0}
.tools button{background:transparent;border:0;color:var(--mute);text-decoration:underline;font-size:14px;cursor:pointer}
#bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--acc);color:var(--onacc);display:none;align-items:center;gap:12px;z-index:10}
#bar.show{display:flex}
#bar.end{animation:fl .5s 3}
@keyframes fl{50%{filter:brightness(1.4)}}
#t{font-size:46px;line-height:1;min-width:96px}
#lb{flex:1;font-size:14px;line-height:1.2}
#bar button{border:2px solid var(--onacc);background:transparent;color:var(--onacc);border-radius:10px;padding:10px 12px;font-size:15px;font-weight:600;cursor:pointer}
@media (prefers-reduced-motion:reduce){#bar.end{animation:none}}
.sh{border-top:0!important;padding:0 0 4px!important;color:var(--mute);font-size:12px}
.sr{display:grid;grid-template-columns:24px 1fr 1fr 46px;gap:10px;align-items:center}
.sr .set{justify-self:end;margin-left:0}
.sk{width:100%;min-width:0}
.set.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.set{border-color:var(--line)}
.card.fin{border-color:var(--line)}
.card.cur{border-color:var(--acc)}
.dots{width:40px;height:40px;border:2px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font-size:20px;cursor:pointer}
.menu{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;padding:12px;background:var(--bg);border-radius:10px}
.menu .step{background:var(--card)}
.step button:disabled{opacity:.3;cursor:default}
.cd{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;color:var(--mute);cursor:pointer;font:inherit}
.cd .name{font-size:19px}.cd .sm{font-size:18px}
</style>
</head>
<body>
<header><div><h1 class="f">Scheda palestra</h1><div class="sub" id="sub"></div></div><button id="th" aria-label="Cambia tema chiaro o scuro"></button></header>
<nav id="nav"></nav>
<main id="list"></main>
<div class="tools"><button id="rs">Azzera le serie di questo giorno</button></div>
<div id="bar" role="timer" aria-live="polite"><div id="t" class="f">0:00</div><div id="lb"></div><button id="p15">+15s</button><button id="sk">Salta</button></div>
<script>
var D=[
{t:"Giorno 1",s:"Petto, tricipiti (richiamo), bicipiti",e:[
["Panca piana manubri",4,"8",32,"",90],
["Panca inclinata multipower",3,"8",20,"",90],
["Croci ai cavi bassi su panca piana",3,"10",17,"",60],
["French press bilanciere EZ a terra",4,"8",10,"per lato",90],
["Bicipiti su panca Scott bilanciere EZ",4,"8",16,"",75],
["Curl a martello manubri alternati",3,"10",15,"",60],
["Curl cavo basso presa semidritta (stripping)",1,"max",55,"serie max, poi scala di 10 kg",0]]},
{t:"Giorno 2",s:"Gambe, spalle",e:[
["Squat con bilanciere",4,"8",100,"",150],
["Leg curl",3,"10",20,"",75],
["Stacchi rumeni",3,"8",100,"",120],
["Leg extension",3,"10",25,"",60],
["Military press al multipower",4,"8",17,"",90],
["Alzate laterali al cavo basso",3,"10",10,"",60],
["Tirate per deltoide posteriore",3,"10",30,"",60]]},
{t:"Giorno 3",s:"Dorsali, tricipiti (richiamo), bicipiti",e:[
["Rematore bilanciere, busto appoggiato alla panca",4,"8","","",90],
["Lat machine presa larga",3,"8","","",90],
["Pulley alto presa triangolo",3,"10","","",75],
["Curl manubri su panca inclinata (allungamento)",4,"8","","",75],
["Panca stretta focus tricipiti",4,"8","","",90],
["Estensioni manubrio sopra la testa",3,"10","","",60],
["Pulldown cavo basso tricipiti (stripping)",1,"max","","serie max, poi scala di 10 kg",0],
["Pull down dorso (finisher)",2,"12",35,"",60]]}
];
var openK=null,EX={};var K="gym-v1",S={day:0,theme:"dark",kg:{},sw:{},sr:{},order:{},rest:{},done:{}},T=null,tick=null,ctx=null;
try{var r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(x){}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(x){}}
function applyTheme(){document.documentElement.setAttribute("data-theme",S.theme);document.getElementById("th").textContent=S.theme=="dark"?"☀":"☾";var m=document.querySelector('meta[name=theme-color]');if(m)m.content=S.theme=="dark"?"#0E1620":"#E8EBEF"}
function id(d,i){return d+"-"+i}
function getOrder(dy){var n=D[dy].e.length,o=(S.order[dy]||[]).filter(function(x){return x<n});for(var i=0;i<n;i++)if(o.indexOf(i)<0)o.push(i);S.order[dy]=o;return o}
function baseKg(k,e){return S.kg[k]!==undefined?S.kg[k]:e[3]}
function repVal(k,n,e){var o=S.sr[k];return o&&o[n]!==undefined?o[n]:(/^\d+$/.test(e[2])?e[2]:"")}
function updSub(){var d=D[S.day],tot=0,dn=0,vol=0;d.e.forEach(function(e,i){var k=id(S.day,i),c=S.done[k]||0;tot+=e[1];dn+=c;for(var n=1;n<=c;n++)vol+=(parseFloat(setKg(k,n,e))||0)*(parseFloat(repVal(k,n,e))||0)});document.getElementById("sub").textContent=d.s+" · "+dn+"/"+tot+" serie · "+Math.round(vol)+" kg di volume"}
function setKg(k,n,e){var o=S.sw[k];for(var m=n;m>=1;m--)if(o&&o[m]!==undefined)return o[m];return baseKg(k,e)}
function refreshKg(k,card,skip){var e=D[S.day].e[+k.split("-")[1]];card.querySelectorAll(".sk[data-sw]").forEach(function(inp){if(inp!==skip&&!(S.sw[k]&&S.sw[k][inp.dataset.n]!==undefined))inp.value=setKg(k,+inp.dataset.n,e)})}
function fmt(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function render(){
var d=D[S.day];
updSub();
document.getElementById("nav").innerHTML=D.map(function(g,i){return '<button class="f" data-day="'+i+'" aria-pressed="'+(i==S.day)+'">'+g.t+'</button>'}).join("");
var ord=getOrder(S.day),cur=-1;
for(var q=0;q<ord.length;q++){if((S.done[id(S.day,ord[q])]||0)<d.e[ord[q]][1]){cur=q;break}}
document.getElementById("list").innerHTML=ord.map(function(i,pos){
var e=d.e[i],k=id(S.day,i),rest=S.rest[k]!==undefined?S.rest[k]:e[5],dn=S.done[k]||0;
if(dn>=e[1]&&!EX[k]&&openK!==k){var mx=0;for(var z=1;z<=e[1];z++)mx=Math.max(mx,parseFloat(setKg(k,z,e))||0);
return '<button class="card cd" data-exp="'+k+'" aria-label="Mostra '+esc(e[0])+'"><span class="name f">\u2713 '+esc(e[0])+'</span><span class="sm f">'+e[1]+"\u00d7"+e[2]+(mx?" \u00b7 "+mx+" kg":"")+'</span></button>'}
var sets='<div class="sr sh"><span></span><span>kg</span><span>rip</span><span></span></div>';
for(var n=1;n<=e[1];n++)sets+='<div class="sr"><span class="sn f">'+n+'</span><input class="sk" type="number" inputmode="decimal" step="0.5" min="0" data-sw="'+k+'" data-n="'+n+'" value="'+esc(setKg(k,n,e))+'" placeholder="kg" aria-label="Kg serie '+n+'"><input class="sk" type="number" inputmode="numeric" step="1" min="0" data-sr="'+k+'" data-n="'+n+'" value="'+esc(repVal(k,n,e))+'" placeholder="rip" aria-label="Ripetizioni serie '+n+'"><button class="set'+(n<=dn?" on":"")+'" data-set="'+n+'" data-k="'+k+'" data-i="'+i+'" aria-label="Serie '+n+(n<=dn?", fatta":", segna come fatta")+'">\u2713</button></div>';
var menu=openK===k?'<div class="menu"><div><label>Recupero</label><div class="step"><button data-r="-15" data-k="'+k+'" aria-label="Meno 15 secondi">\u2212</button><span data-rv="'+k+'">'+(rest?fmt(rest):"off")+'</span><button data-r="15" data-k="'+k+'" aria-label="Pi\u00f9 15 secondi">+</button></div></div><div><label>Posizione</label><div class="step"><button data-mv="-1" data-pos="'+pos+'"'+(pos==0?" disabled":"")+' aria-label="Sposta su">\u25b2</button><button data-mv="1" data-pos="'+pos+'"'+(pos==ord.length-1?" disabled":"")+' aria-label="Sposta gi\u00f9">\u25bc</button></div></div></div>':'';
return '<section class="card'+(pos==cur?" cur":"")+'"><div class="top"><div><div class="name f">'+esc(e[0])+'</div>'+(e[4]?'<div class="note">'+esc(e[4])+'</div>':'')+'</div><div class="rt"><div class="scheme f">'+e[1]+"\u00d7"+e[2]+'</div><button class="dots" data-menu="'+k+'" aria-expanded="'+(openK===k)+'" aria-label="Opzioni esercizio">\u22ef</button></div></div>'+menu+'<div class="sets">'+sets+'</div></section>'}).join("");
}
function beep(){try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();[0,.25,.5].forEach(function(t){var o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=880;g.gain.value=.25;o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+.15)})}catch(x){}
try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(x){}}
function stop(){T=null;clearInterval(tick);document.getElementById("bar").className=""}
function start(sec,label){
try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();ctx.resume&&ctx.resume()}catch(x){}
T={end:Date.now()+sec*1000,label:label};document.getElementById("bar").className="show";document.getElementById("lb").textContent=label;
clearInterval(tick);tick=setInterval(upd,250);upd()}
function upd(){if(!T)return;var left=(T.end-Date.now())/1000;document.getElementById("t").textContent=fmt(left);
if(left<=0){clearInterval(tick);beep();document.getElementById("t").textContent="Via!";document.getElementById("lb").textContent="Recupero finito: tocca a te";document.getElementById("bar").className="show end";T=null;setTimeout(function(){if(!T)document.getElementById("bar").className=""},6000)}}
document.addEventListener("click",function(ev){
var b=ev.target.closest("button");if(!b)return;var d=b.dataset;
if(d.day!==undefined){S.day=+d.day;openK=null;EX={};save();stop();render();return}
if(d.menu){openK=openK===d.menu?null:d.menu;render();return}
if(d.exp){EX[d.exp]=true;render();return}
if(d.mv){var o=getOrder(S.day),p=+d.pos,q=p+ +d.mv;if(q>=0&&q<o.length){var tmp=o[p];o[p]=o[q];o[q]=tmp;save();render()}return}
if(d.set){var n=+d.set,k=d.k,cur=S.done[k]||0,e=D[S.day].e[+d.i];
if(n<=cur){S.done[k]=n-1;save();render();return}
for(var m=1;m<=n;m++){S.sw[k]=S.sw[k]||{};S.sw[k][m]=setKg(k,m,e);S.sr[k]=S.sr[k]||{};S.sr[k][m]=repVal(k,m,e)}
S.done[k]=n;save();render();
var rest=S.rest[k]!==undefined?S.rest[k]:e[5];
if(rest>0)start(rest,e[0]+": serie "+n+" di "+e[1]+" fatta, recupera");else stop();return}
if(d.r){var e2=D[S.day].e[+d.k.split("-")[1]],c=S.rest[d.k]!==undefined?S.rest[d.k]:e2[5];
c=Math.max(0,Math.min(600,c+ +d.r));S.rest[d.k]=c;save();document.querySelector('[data-rv="'+d.k+'"]').textContent=c?fmt(c):"off";return}
if(b.id==="th"){S.theme=S.theme=="dark"?"light":"dark";save();applyTheme();return}
if(b.id==="sk"){stop();return}
if(b.id==="p15"&&T){T.end+=15000;upd();return}
if(b.id==="rs"){D[S.day].e.forEach(function(_,i){delete S.done[id(S.day,i)]});save();stop();render()}
});
document.addEventListener("input",function(ev){var t=ev.target,ds=t.dataset||{};
if(ds.kg){var k=ds.kg;S.kg[k]=t.value;save();t.closest(".card").querySelectorAll(".sk[data-sw]").forEach(function(inp){var o=S.sw[k];if(!(o&&o[inp.dataset.n]!==undefined))inp.value=t.value});return}
if(ds.sw){var k2=ds.sw;S.sw[k2]=S.sw[k2]||{};S.sw[k2][ds.n]=t.value;save();updSub();refreshKg(k2,t.closest(".card"),t)}
if(ds.sr){var k3=ds.sr;S.sr[k3]=S.sr[k3]||{};S.sr[k3][ds.n]=t.value;save();updSub()}});
applyTheme();render();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
