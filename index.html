<style>

h1{margin:0;font-size:30px;line-height:1}
.sub{color:var(--mute);font-size:14px;margin-top:4px}

.row{display:flex;gap:12px;margin-top:12px;align-items:end;flex-wrap:wrap}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:4px}

.step button{width:40px;height:42px;border:0;background:transparent;color:var(--ink);font-size:22px;cursor:pointer}
.step span{min-width:56px;text-align:center;font:700 22px "Barlow Condensed","Arial Narrow",sans-serif}
.sets{display:flex;flex-direction:column;margin-top:12px}.sr{display:flex;align-items:center;gap:6px;padding:8px 0;border-top:1px solid var(--line)}.sn{width:22px;font-size:20px;color:var(--mute)}.u{font-size:12px;color:var(--mute);margin-right:6px}.sr .set{width:46px;height:46px;margin-left:auto;font-size:22px}.sc{display:flex;flex-direction:column;align-items:center;gap:6px}.sk{width:58px;font:700 18px "Barlow Condensed","Arial Narrow",sans-serif;text-align:center;padding:4px 2px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}.rt{display:flex;gap:10px;align-items:center}.mv{display:flex;flex-direction:column;gap:4px}.mv button{width:36px;height:30px;border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;cursor:pointer;font-size:14px}.mv button:disabled{opacity:.3;cursor:default}
.set{width:52px;height:52px;border-radius:50%;border:2px solid var(--ink);background:transparent;color:var(--ink);font:700 22px "Barlow Condensed","Arial Narrow",sans-serif;cursor:pointer}
.set.on{background:var(--ok);color:var(--onok)}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.tools{display:flex;justify-content:center;gap:10px;padding:8px 0}
.tools button{background:transparent;border:0;color:var(--mute);text-decoration:underline;font-size:14px;cursor:pointer}
#bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--acc);color:var(--onacc);display:none;align-items:center;gap:12px;z-index:10}
#bar.show{display:flex}
#bar.end{animation:fl .5s 3}
@keyframes fl{50%{filter:brightness(1.4)}}
#t{font-size:46px;line-height:1;min-width:96px}
#lb{flex:1;font-size:14px;line-height:1.2}
#bar button{border:2px solid var(--onacc);background:transparent;color:var(--onacc);border-radius:10px;padding:10px 12px;font-size:15px;font-weight:600;cursor:pointer}
@media (prefers-reduced-motion:reduce){#bar.end{animation:none}}
.sh{border-top:0!important;padding:0 0 4px!important;color:var(--mute);font-size:12px}
.sr{display:grid;grid-template-columns:24px 1fr 1fr 46px;gap:10px;align-items:center}
.sr .set{justify-self:end;margin-left:0}
.sk{width:100%;min-width:0}
.set.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.set{border-color:var(--line)}
.card.fin{border-color:var(--line)}
.card.cur{border-color:var(--acc)}
.dots{width:40px;height:40px;border:2px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font-size:20px;cursor:pointer}
.menu{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;padding:12px;background:var(--bg);border-radius:10px}
.menu .step{background:var(--card)}
.step button:disabled{opacity:.3;cursor:default}
.cd{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;color:var(--mute);cursor:pointer;font:inherit}
.cd .name{font-size:19px}.cd .sm{font-size:18px}
.hx{margin-top:10px;display:grid;gap:8px;font-size:14px;color:var(--mute)}.hx b{color:var(--ink);font-weight:600}
.tools #fin{background:var(--acc);color:var(--onacc);text-decoration:none;padding:12px 18px;border-radius:10px;font-weight:600;font-size:16px}
.sg{margin-top:10px;padding:8px 10px;background:var(--bg);border-radius:10px;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sg button{margin-left:auto;border:2px solid var(--acc);background:transparent;color:var(--ink);border-radius:8px;padding:6px 12px;font-weight:600;cursor:pointer}
nav button{font-size:18px}
.nmf{flex-basis:100%}.nmi{width:100%;font:600 18px system-ui,sans-serif;padding:8px 10px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.lv{margin-top:8px;font-size:13px;color:var(--mute)}
.tools{flex-wrap:wrap}
.dsc{margin-top:10px;font-size:14px;padding:8px 10px;border-radius:10px;background:var(--bg)}
.seg button{width:auto;padding:0 10px;font-size:14px;font-weight:600}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--onacc)}
.pbtn{border:0;background:var(--acc);color:var(--onacc);padding:12px 16px;border-radius:10px;font-weight:600;font-size:16px;cursor:pointer;margin-top:10px}
.dng{background:transparent;border:2px solid var(--line);color:var(--ink)}
.sel{width:100%;padding:8px 10px;font-size:16px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.addf{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.addf .nmi{margin-top:8px}.addr{display:flex;gap:8px;margin-top:8px}.addr .sk{width:70px;flex:none}
.vr{display:grid;grid-template-columns:84px 1fr 26px 34px;gap:8px;align-items:center;margin:6px 0}
.vb{height:10px;background:var(--bg);border-radius:6px;overflow:hidden}.vb i{display:block;height:100%;background:var(--acc)}
.vr small,.rr small{color:var(--mute)}
.rr{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.ln{fill:none;stroke:var(--acc);stroke-width:2.5}.dt{fill:var(--acc)}.tx{fill:var(--mute);font-size:10px}
.pr{color:var(--acc);font-size:12px;font-weight:600}
.focus .fn{font-size:30px;line-height:1.1;margin:6px 0}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.fc{display:flex;gap:6px;align-items:center}
.fc button{width:44px;height:52px;border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;font-size:24px;cursor:pointer;flex:none}
.fbig{font-size:28px!important;text-align:center;height:52px}
.okbig{width:100%;margin-top:16px;padding:18px;border:0;border-radius:14px;background:var(--acc);color:var(--onacc);font:700 26px "Barlow Condensed","Arial Narrow",sans-serif;cursor:pointer}
.fa2{display:flex;gap:10px;margin-top:10px}
.fa2 button{flex:1;border:2px solid var(--line);background:transparent;color:var(--mute);border-radius:10px;padding:10px;cursor:pointer}
.more{max-width:640px;margin:0 auto;padding:0 16px 16px}
.more summary{cursor:pointer;color:var(--mute);text-align:center;padding:8px}
nav{overflow-x:auto}nav button{flex:1 0 auto;min-width:64px;padding:10px 12px}
</style>
</head>

<script>

];
var openK=null,EX={},HV=false,SV=false,EV=false,FS={},SEX="";var K="gym-v1",S={day:0,theme:"dark",mg:{},fm:false,bg:true,wl:false,pl:{},tp:{},bw:{},xs:{},notes:{},names:{},hist:[],start:null,kg:{},sw:{},sr:{},order:{},rest:{},done:{}},T=null,tick=null,ctx=null;
try{var r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(x){}

function updSub(){var d=D[S.day],tot=0,dn=0,vol=0;d.e.forEach(function(e,i){var k=id(S.day,i),c=S.done[k]||0;if(e[6])return;tot+=ns(k,e);dn+=c;for(var n=1;n<=c;n++)vol+=load(k,e,parseFloat(setKg(k,n,e))||0)*(parseFloat(repVal(k,n,e))||0)});document.getElementById("sub").textContent=d.s+" · "+dn+"/"+tot+" serie · "+Math.round(vol)+" kg di volume"+(S.hist.length&&S.day==nextDay()?" \u00b7 tocca oggi":"")}

var P=[20,10,5,2,1,0.5],o=[],r=pl;P.forEach(function(q){while(r+1e-9>=q){o.push(q);r-=q}});

if(/bicip|curl|martello|scott/.test(n))return"Bicipiti";
if(/panca|croci|petto|pectoral|dip/.test(n))return"Petto";

function muscleOpts(sel){return MG.concat("Altro").map(function(m){return '<option'+(m==sel?' selected':'')+'>'+m+'</option>'}).join("")}
function E(k){var p=k.split("-");return D[+p[0]].e[+p[1]]}
function view(v){HV=v=="h";SV=v=="s";EV=v=="e"}

function maxE(sets){var b=0;sets.forEach(function(t){b=Math.max(b,e1(t[0],t[1]))});return b}

if(n<=cur){S.done[k]=n-1;save();render();return}

if(rest>0)start(rest,nm(k,e)+": serie "+n+" di "+ns(k,e)+" fatta, recupera");else stop()}

if(d.ok){var q2=d.ok.split("|");doSet(q2[0],+q2[1],E(q2[0]));return}
if(d.un){S.done[d.un]=Math.max(0,(S.done[d.un]||0)-1);save();render();return}
if(d.sk){FS[d.sk]=1;render();return}
if(d.pl!==undefined){S.pl[d.k]=d.pl==="1";save();render();return}
if(d.tp){S.tp[d.k]=d.tp;save();render();return}
if(d.xs){var kk=d.k,ee=D[S.day].e[+kk.split("-")[1]];S.xs[kk]=Math.max(1-ee[1],Math.min(10,(S.xs[kk]||0)+ +d.xs));if((S.done[kk]||0)>ns(kk,ee))S.done[kk]=ns(kk,ee);save();render();return}

if(d.set){doSet(d.k,+d.set,D[S.day].e[+d.i]);return}

c=Math.max(0,Math.min(600,c+ +d.r));S.rest[d.k]=c;save();document.querySelector('[data-rv="'+d.k+'"]').textContent=c?fmt(c):"off";return}
if(b.id==="th"){S.theme=S.theme=="dark"?"light":"dark";save();applyTheme();return}

if(b.id==="rs"){S.start=null;wlOff();D[S.day].e.forEach(function(_,i){delete S.done[id(S.day,i)]});save();stop();render()}

document.addEventListener("input",function(ev){var t=ev.target,ds=t.dataset||{};
if(ds.kg){var k=ds.kg;S.kg[k]=t.value;save();t.closest(".card").querySelectorAll(".sk[data-sw]").forEach(function(inp){var o=S.sw[k];if(!(o&&o[inp.dataset.n]!==undefined))inp.value=t.value});return}

if(ds.bw){S.bw[ds.bw]=t.value;save();refreshDsc(ds.bw);updSub();return}
if(ds.nt){if(t.value.trim())S.notes[ds.nt]=t.value.trim();else delete S.notes[ds.nt];save();return}
if(ds.nm){var v=t.value.trim();if(v)S.names[ds.nm]=v;else delete S.names[ds.nm];save();var nel=t.closest(".card").querySelector(".name");if(nel)nel.textContent=v||D[S.day].e[+ds.nm.split("-")[1]][0];return}

document.addEventListener("change",function(ev){var t=ev.target,ds=t.dataset||{};
if(ds.rp){var v=t.value.trim();if(v){E(ds.rp)[2]=v;save();render()}return}
if(ds.mg){S.mg[ds.mg]=t.value;save();return}
if(ds.sx!==undefined){SEX=t.value;render()}});

applyTheme();render();
